 · 2.34 CPU s</text><circle cx="1126" cy="840" r="14" fill="#8d8d87"/><text x="1126" y="845" font-size="14" fill="#fff" font-weight="600" text-anchor="middle" >22</text><text x="1154" y="838" font-size="18" fill="#1d1d1d" font-weight="400" text-anchor="start" >CLIP + reference crops of the area</text><text x="1154" y="860" font-size="14" fill="#686d62" font-weight="400" text-anchor="start" >3,218 points · about 3 s (20 threads)</text><circle cx="1126" cy="892" r="14" fill="#8d8d87"/><text x="1126" y="897" font-size="14" fill="#fff" font-weight="600" text-anchor="middle" >24</text><text x="1154" y="890" font-size="18" fill="#1d1d1d" font-weight="400" text-anchor="start" >CLIP + colour, logistic regression</text><text x="1154" y="912" font-size="14" fill="#686d62" font-weight="400" text-anchor="start" >3,205 points · 0.8 s (2 threads)</text><text x="60" y="1048" font-size="17" fill="#686d62" font-weight="400" text-anchor="start" >Red: no other approach is both cheaper and higher. Grey bars show a reported range; a thin line links a number moved aside to its true spot.</text><text x="60" y="1078" font-size="17" fill="#686d62" font-weight="400" text-anchor="start" >The baseline (1,554 points, 0 s) is left out so the axis can start at 3,180.</text><text x="60" y="1106" font-size="17" fill="#686d62" font-weight="400" text-anchor="start" >Times come from different machines and thread counts, as noted in LEADERBOARD.md, so read this as a guide and not an exact comparison.</text></svg>