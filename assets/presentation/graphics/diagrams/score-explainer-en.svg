<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1810 1060" width="1810" height="1060" role="img" aria-label="How an area is scored" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>How an area is scored</title><rect width="1810" height="1060" fill="#f8f7f4"/><text x="60" y="84" font-size="46" fill="#1d1d1d" font-weight="600" text-anchor="start" >How an area is scored</text><text x="60" y="126" font-size="24" fill="#686d62" font-weight="400" text-anchor="start" >Each planogram area earns up to 2 points: 1 for the product and 1 for the stock level.</text><rect x="60" y="170" width="820" height="450" rx="22" fill="#efeee9" stroke="#dbd9cd" stroke-width="1.5"/><text x="96" y="232" font-size="30" fill="#1d1d1d" font-weight="600" text-anchor="start" >Product identification</text><text x="96" y="266" font-size="20" fill="#686d62" font-weight="400" text-anchor="start" >planogram_compliant</text><rect x="84" y="296" width="772" height="130" rx="16" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><rect x="104" y="318" width="110" height="50" rx="25.0" fill="#dcebdf"/><text x="159.0" y="352.1" font-size="26" fill="#3f8a4f" font-weight="600" text-anchor="middle" >+1</text><text x="240" y="334" font-size="24" fill="#1d1d1d" font-weight="600" text-anchor="start" >Correct identification</text><text x="240" y="366" font-size="19" fill="#51554c" font-weight="400" text-anchor="start" >The area holds the product the planogram says.</text><rect x="84" y="446" width="772" height="130" rx="16" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><rect x="104" y="468" width="110" height="50" rx="25.0" fill="#f1dcd6"/><text x="159.0" y="502.1" font-size="26" fill="#c4452f" font-weight="600" text-anchor="middle" >−2</text><text x="240" y="484" font-size="24" fill="#1d1d1d" font-weight="600" text-anchor="start" >Wrong identification</text><text x="240" y="516" font-size="19" fill="#51554c" font-weight="400" text-anchor="start" >Staff go there to arrange products and there is nothing to arrange.</text><rect x="920" y="170" width="820" height="450" rx="22" fill="#efeee9" stroke="#dbd9cd" stroke-width="1.5"/><text x="956" y="232" font-size="30" fill="#1d1d1d" font-weight="600" text-anchor="start" >Stock level</text><text x="956" y="266" font-size="20" fill="#686d62" font-weight="400" text-anchor="start" >stock_value: 0 empty, 0.5 half, 1 full</text><rect x="944" y="296" width="772" height="96" rx="16" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><rect x="964" y="318" width="110" height="50" rx="25.0" fill="#dcebdf"/><text x="1019.0" y="352.1" font-size="26" fill="#3f8a4f" font-weight="600" text-anchor="middle" >+1</text><text x="1100" y="334" font-size="24" fill="#1d1d1d" font-weight="600" text-anchor="start" >Correct stock level</text><text x="1100" y="366" font-size="19" fill="#51554c" font-weight="400" text-anchor="start" ></text><rect x="944" y="406" width="772" height="96" rx="16" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><rect x="964" y="428" width="110" height="50" rx="25.0" fill="#f1dcd6"/><text x="1019.0" y="462.1" font-size="26" fill="#c4452f" font-weight="600" text-anchor="middle" >−2</text><text x="1100" y="444" font-size="24" fill="#1d1d1d" font-weight="600" text-anchor="start" >Below the real shelf stock</text><text x="1100" y="476" font-size="19" fill="#51554c" font-weight="400" text-anchor="start" >Staff go to replenish and the shelf is already full.</text><rect x="944" y="516" width="772" height="96" rx="16" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><rect x="964" y="538" width="110" height="50" rx="25.0" fill="#f1dcd6"/><text x="1019.0" y="572.1" font-size="26" fill="#c4452f" font-weight="600" text-anchor="middle" >−3</text><text x="1100" y="554" font-size="24" fill="#1d1d1d" font-weight="600" text-anchor="start" >Above the real shelf stock</text><text x="1100" y="586" font-size="19" fill="#51554c" font-weight="400" text-anchor="start" >The shelf runs empty with no one noticing, and sales are lost.</text><text x="60" y="690" font-size="28" fill="#1d1d1d" font-weight="600" text-anchor="start" >Example from the brief: 289 areas, 320 points out of a maximum of 578</text><rect x="60" y="720" width="330" height="190" rx="18" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><text x="84" y="765" font-size="20" fill="#51554c" font-weight="500" text-anchor="start" >Identification correct</text><text x="84" y="825" font-size="28" fill="#1d1d1d" font-weight="600" text-anchor="start" >270 areas × +1</text><text x="84" y="880" font-size="40" fill="#3f8a4f" font-weight="600" text-anchor="start" >+270</text><rect x="400" y="720" width="330" height="190" rx="18" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><text x="424" y="765" font-size="20" fill="#51554c" font-weight="500" text-anchor="start" >Identification wrong</text><text x="424" y="825" font-size="28" fill="#1d1d1d" font-weight="600" text-anchor="start" >19 areas × −2</text><text x="424" y="880" font-size="40" fill="#c4452f" font-weight="600" text-anchor="start" >−38</text><rect x="740" y="720" width="330" height="190" rx="18" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><text x="764" y="765" font-size="20" fill="#51554c" font-weight="500" text-anchor="start" >Stock correct</text><text x="764" y="825" font-size="28" fill="#1d1d1d" font-weight="600" text-anchor="start" >230 areas × +1</text><text x="764" y="880" font-size="40" fill="#3f8a4f" font-weight="600" text-anchor="start" >+230</text><rect x="1080" y="720" width="330" height="190" rx="18" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><text x="1104" y="765" font-size="20" fill="#51554c" font-weight="500" text-anchor="start" >Stock below the real stock</text><text x="1104" y="825" font-size="28" fill="#1d1d1d" font-weight="600" text-anchor="start" >35 areas × −2</text><text x="1104" y="880" font-size="40" fill="#c4452f" font-weight="600" text-anchor="start" >−70</text><rect x="1420" y="720" width="330" height="190" rx="18" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><text x="1444" y="765" font-size="20" fill="#51554c" font-weight="500" text-anchor="start" >Stock above the real stock</text><text x="1444" y="825" font-size="28" fill="#1d1d1d" font-weight="600" text-anchor="start" >24 areas × −3</text><text x="1444" y="880" font-size="40" fill="#c4452f" font-weight="600" text-anchor="start" >−72</text><rect x="60" y="930" width="1690" height="80" rx="18" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/><text x="100" y="982" font-size="26" fill="#f8f7f4" font-weight="500" text-anchor="start" >Total</text><text x="1710" y="984" font-size="34" fill="#f8f7f4" font-weight="600" text-anchor="end" >+320 of 578   (289 × 2)</text><text x="60" y="1034" font-size="17" fill="#686d62" font-weight="400" text-anchor="start" >An area that is annotated but missing from the output counts as a wrong identification (−2) and a stock level above the real stock (−3). Source: Sensei challenge brief.</text></svg>