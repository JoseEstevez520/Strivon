<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 720" width="1800" height="720" role="img" aria-label="De una foto de cámara a una lista de trabajo" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>De una foto de cámara a una lista de trabajo</title><rect width="1800" height="720" fill="#f8f7f4"/><text x="60" y="80" font-size="44" fill="#1d1d1d" font-weight="600" text-anchor="start" >De una foto de cámara a una lista de trabajo</text><rect x="60" y="150" width="300" height="230" rx="22" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><text x="210" y="312" font-size="22" fill="#1d1d1d" font-weight="600" text-anchor="middle" >Foto de cámara de techo</text><text x="210" y="342.0" font-size="18" fill="#686d62" font-weight="400" text-anchor="middle" >Una foto de una góndola,</text><text x="210" y="365.4" font-size="18" fill="#686d62" font-weight="400" text-anchor="middle" >cada hora más o menos</text><g transform="translate(150 170)"><rect width="120" height="86" rx="16" fill="none" stroke="#1d1d1d" stroke-width="5"/><circle cx="60" cy="43" r="22" fill="none" stroke="#1d1d1d" stroke-width="5"/><rect x="20" y="-12" width="30" height="14" rx="5" fill="#1d1d1d"/></g><rect x="60" y="420" width="300" height="230" rx="22" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><text x="210" y="582" font-size="22" fill="#1d1d1d" font-weight="600" text-anchor="middle" >Planograma de la tienda</text><text x="210" y="612.0" font-size="18" fill="#686d62" font-weight="400" text-anchor="middle" >Qué producto va en</text><text x="210" y="635.4" font-size="18" fill="#686d62" font-weight="400" text-anchor="middle" >cada zona de estantería</text><g transform="translate(125 440)"><rect x="0" y="0" width="56" height="50" rx="8" fill="#e6e4dd"/><rect x="66" y="0" width="56" height="50" rx="8" fill="#d98a77"/><rect x="0" y="60" width="56" height="50" rx="8" fill="#e1a898"/><rect x="66" y="60" width="56" height="50" rx="8" fill="#c4452f"/></g><path d="M370 265H466M452 253L466 265L452 277" fill="none" stroke="#686d62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M370 535H466M452 523L466 535L452 547" fill="none" stroke="#686d62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="150" width="440" height="500" rx="22" fill="#efeee9" stroke="#dbd9cd" stroke-width="1.5"/><text x="700" y="205" font-size="26" fill="#1d1d1d" font-weight="600" text-anchor="middle" >Se revisa cada zona de estantería</text><rect x="510" y="250" width="380" height="160" rx="18" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><text x="530" y="302" font-size="22" fill="#1d1d1d" font-weight="600" text-anchor="start" >¿Está el producto correcto?</text><text x="530" y="350" font-size="22" fill="#686d62" font-weight="400" text-anchor="start" >sí o no</text><circle cx="868" cy="278" r="14" fill="#e6e4dd"/><text x="868" y="285" font-size="18" fill="#51554c" font-weight="600" text-anchor="middle" >1</text><rect x="510" y="440" width="380" height="160" rx="18" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><text x="530" y="492" font-size="22" fill="#1d1d1d" font-weight="600" text-anchor="start" >¿Cuánto está de llena?</text><text x="530" y="540" font-size="22" fill="#686d62" font-weight="400" text-anchor="start" >vacía, a medias o llena</text><circle cx="868" cy="468" r="14" fill="#e6e4dd"/><text x="868" y="475" font-size="18" fill="#51554c" font-weight="600" text-anchor="middle" >2</text><path d="M930 400H1016M1002 388L1016 400L1002 412" fill="none" stroke="#686d62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1030" y="150" width="380" height="500" rx="22" fill="#efeee9" stroke="#dbd9cd" stroke-width="1.5"/><text x="1220" y="205" font-size="26" fill="#1d1d1d" font-weight="600" text-anchor="middle" >Tareas para el personal</text><rect x="1055" y="250" width="330" height="105" rx="18" fill="#f1dcd6" stroke="#f1dcd6" stroke-width="1.5"/><circle cx="1090" cy="302" r="12" fill="#c4452f"/><text x="1118" y="298" font-size="24" fill="#1d1d1d" font-weight="600" text-anchor="start" >Reponer</text><text x="1118" y="330" font-size="19" fill="#51554c" font-weight="400" text-anchor="start" >lo que está vacío</text><rect x="1055" y="380" width="330" height="105" rx="18" fill="#f0e4cf" stroke="#f0e4cf" stroke-width="1.5"/><circle cx="1090" cy="432" r="12" fill="#b7791f"/><text x="1118" y="428" font-size="24" fill="#1d1d1d" font-weight="600" text-anchor="start" >Devolver a su sitio</text><text x="1118" y="460" font-size="19" fill="#51554c" font-weight="400" text-anchor="start" >lo que está mal colocado</text><rect x="1055" y="510" width="330" height="105" rx="18" fill="#e6e4dd" stroke="#e6e4dd" stroke-width="1.5"/><circle cx="1090" cy="562" r="12" fill="#51554c"/><text x="1118" y="558" font-size="24" fill="#1d1d1d" font-weight="600" text-anchor="start" >Más tarde</text><text x="1118" y="590" font-size="19" fill="#51554c" font-weight="400" text-anchor="start" >lo que está a medias</text><path d="M1420 400H1496M1482 388L1496 400L1482 412" fill="none" stroke="#686d62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1510" y="150" width="230" height="500" rx="22" fill="#efeee9" stroke="#dbd9cd" stroke-width="1.5"/><text x="1625" y="205" font-size="22" fill="#1d1d1d" font-weight="600" text-anchor="middle" >Dónde aparece</text><rect x="1525" y="240" width="200" height="115" rx="16" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><text x="1625" y="288" font-size="22" fill="#1d1d1d" font-weight="600" text-anchor="middle" >Plano de la tienda</text><text x="1625" y="316.0" font-size="16" fill="#686d62" font-weight="400" text-anchor="middle" >2D, 3D o</text><text x="1625" y="336.8" font-size="16" fill="#686d62" font-weight="400" text-anchor="middle" >fotos reales</text><rect x="1525" y="375" width="200" height="115" rx="16" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><text x="1625" y="423" font-size="22" fill="#1d1d1d" font-weight="600" text-anchor="middle" >La ronda</text><text x="1625" y="451.0" font-size="16" fill="#686d62" font-weight="400" text-anchor="middle" >orden de paradas,</text><text x="1625" y="471.8" font-size="16" fill="#686d62" font-weight="400" text-anchor="middle" >qué llevar</text><rect x="1525" y="510" width="200" height="115" rx="16" fill="#ffffff" stroke="#dbd9cd" stroke-width="1.5"/><text x="1625" y="558" font-size="22" fill="#1d1d1d" font-weight="600" text-anchor="middle" >Chat</text><text x="1625" y="586.0" font-size="16" fill="#686d62" font-weight="400" text-anchor="middle" >respuestas como</text><text x="1625" y="606.8" font-size="16" fill="#686d62" font-weight="400" text-anchor="middle" >pantalla</text></svg>